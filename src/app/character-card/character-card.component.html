<div class="character-card-container">
  @if (currentMode === 'card') {
    <app-character-stats
      [character]="character"
      (deleteRequest)="onDelete($event)"
      (refreshRequest)="onRefresh($event)"
      (showSkillsRequest)="switchToSkills()">
    </app-character-stats>
  }

  @if (currentMode === 'skills') {
    <app-character-skills
      [character]="character"
      (back)="switchToStats()">
    </app-character-skills>
  }
</div>
