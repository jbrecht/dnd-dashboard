<div class="dashboard-container">
  <div class="dashboard-content">
    <!-- Top Right Controls -->
    <div class="top-right-controls">
      <button
        mat-icon-button
        (click)="openHelp()"
        class="help icon-btn"
        matTooltip="View Help Video"
        [attr.aria-label]="'View help'">
        <mat-icon>help</mat-icon>
      </button>
      <button
        mat-icon-button
        (click)="toggleTheme()"
        class="theme-toggle icon-btn"
        [matTooltip]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        [attr.aria-label]="'Toggle theme'">
        <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button
        mat-icon-button
        (click)="refreshCharacters()"
        class="reload-all icon-btn"
        matTooltip="Reload All Characters"
        [attr.aria-label]="'Reload all characters'">
        <mat-icon>refresh</mat-icon>
      </button>
      <button
        mat-icon-button
        (click)="toggleStatDisplayMode()"
        class="stat-mode-toggle icon-btn"
        [matTooltip]="
          statDisplayMode === 'value-top'
            ? 'Switch to Modifier Emphasis'
            : 'Switch to Score Emphasis'
        "
        [attr.aria-label]="'Toggle stat display mode'">
        <mat-icon>{{ statDisplayMode === 'value-top' ? 'numbers' : 'exposure' }}</mat-icon>
      </button>

      <button
        mat-icon-button
        (click)="toggleViewMode()"
        class="view-toggle icon-btn"
        [matTooltip]="viewMode === 'card' ? 'Switch to Skills View' : 'Switch to Card View'"
        [attr.aria-label]="'Toggle view mode'">
        <mat-icon>{{ viewMode === 'card' ? 'school' : 'grid_view' }}</mat-icon>
      </button>
      @if (!showInput) {
        <button
          mat-icon-button
          (click)="toggleInput()"
          class="add-btn icon-btn"
          matTooltip="Add Character"
          [attr.aria-label]="'Show input'">
          <mat-icon>person_add</mat-icon>
        </button>
      }
    </div>

    <!-- Input Card (Centered) -->
    @if (showInput) {
      <div class="input-card-container">
        <div class="input-card">
          <button
            mat-icon-button
            (click)="toggleInput()"
            class="close-btn"
            [attr.aria-label]="'Hide input'">
            <mat-icon>close</mat-icon>
          </button>
          <div class="input-container">
            <mat-form-field appearance="outline" class="w-full">
              <mat-label>Character ID</mat-label>
              <input
                matInput
                [(ngModel)]="characterInput"
                placeholder="123456"
                (keyup.enter)="importCharacter()" />
              <mat-icon matPrefix class="mr-2 text-gray-400">tag</mat-icon>
              <button
                mat-icon-button
                matSuffix
                (click)="importCharacter()"
                [attr.aria-label]="'Import character'"
                color="primary">
                <mat-icon>download</mat-icon>
              </button>
              @if (!error) {
                <mat-hint>Enter DnD Beyond Character ID</mat-hint>
              }
              @if (error) {
                <mat-hint style="color: #ef4444">{{ error }}</mat-hint>
              }
            </mat-form-field>
          </div>
        </div>
      </div>
    }

    <div class="character-grid">
      @for (char of characters; track trackById($index, char)) {
        <app-character-card
          [character]="char"
          [viewMode]="viewMode"
          [statDisplayMode]="statDisplayMode"
          (deleteRequest)="removeCharacter(char.id)"
          (refreshRequest)="refreshCharacter(char.id)"
          [@cardAnimation]>
        </app-character-card>
      }
    </div>
  </div>
</div>
